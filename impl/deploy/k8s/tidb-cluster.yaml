# =============================================================================
# TiDB 集群：StatefulSet + 静态本地 PV（离线环境最佳方案）
#
# 背景（ADR-018）：
#   - 原实现是 3 个独立 Deployment，无稳定身份，Pod 重建后 PD 中残留 store
#   - 原 PVC 为 local-path 10Gi，不可扩容
#   - 服务器无外网，无法拉取 TiDB Operator 镜像 → 采用手工 StatefulSet
#   - TiKV 的正确扩容方式是"横向加副本 + 加 PV"，不是扩 PVC（Raft 分片自动再平衡）
#
# 存储规划（worker1 /home 3.0T，可用 2.3T）：
#   tikv-0/1/2  200Gi ×3 = 600Gi
#   pd-0/1/2     20Gi ×3 =  60Gi
#   tiflash-0   100Gi    = 100Gi
#   合计 760Gi，保留约 1.5T 余量
# =============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pdm-local-ssd
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pdm-tikv-0
  labels: {component: tikv, ordinal: "0"}
spec:
  capacity: {storage: 200Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pdm-local-ssd
  local: {path: /home/k8s-data/pdm-ssd/tikv-0}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [k8s-worker1]}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pdm-tikv-1
  labels: {component: tikv, ordinal: "1"}
spec:
  capacity: {storage: 200Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pdm-local-ssd
  local: {path: /home/k8s-data/pdm-ssd/tikv-1}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [k8s-worker1]}

