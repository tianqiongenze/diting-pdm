<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谛听 PdM · 管理台</title>
<style>
/* ===== 设计系统 · 浅色管理台 ===== */
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --panel-2:#FAFBFD; --line:#E4E9F2; --line-2:#CFD8E6;
  --txt:#0F172A; --txt-2:#5B6B84; --txt-3:#94A3B8;
  --accent:#1D4ED8; --accent-l:#EFF4FF; --accent-2:#4F46E5;
  --red:#E11D48; --red-l:#FFF1F4;
  --orange:#EA580C; --orange-l:#FFF6ED;
  --yellow:#CA8A04; --yellow-l:#FEFCE8;
  --green:#16A34A; --green-l:#F0FDF4;
  --sh-s:0 1px 2px rgba(15,23,42,.05);
  --sh-m:0 2px 8px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --sh-l:0 8px 28px rgba(15,23,42,.10);
  --r-s:7px; --r-m:11px; --r-l:15px;
  --f-num:ui-monospace,"SF Mono",Consolas,monospace;
  --nav-w:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ===== 侧导航 ===== */
.nav{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:#0B1220;
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:30;
}
.nav .brand{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#38BDF8,#6366F1);color:#fff;font-weight:800;
  font-size:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(56,189,248,.35);
}
.nav a{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:#7C8CA6;transition:.18s;position:relative;
}
.nav a:hover{background:rgba(255,255,255,.07);color:#CBD5E1}
.nav a.on{background:rgba(56,189,248,.14);color:#38BDF8}
.nav a.on::before{
  content:"";position:absolute;left:-10px;top:11px;bottom:11px;width:3px;
  border-radius:0 3px 3px 0;background:#38BDF8;box-shadow:0 0 10px #38BDF8;
}
.nav a[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:48px;white-space:nowrap;
  background:#0B1220;color:#E2E8F0;font-size:12px;padding:5px 10px;border-radius:7px;
  border:1px solid rgba(56,189,248,.25);z-index:40;
}
.nav .sp{flex:1}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
         stroke-linecap:round;stroke-linejoin:round}

/* ===== 主体 ===== */
.main{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{
  height:60px;flex:0 0 60px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:16px;padding:0 22px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:16.5px;font-weight:650;letter-spacing:.2px}
.crumb{font-size:12.5px;color:var(--txt-3)}
.crumb b{color:var(--txt-2);font-weight:500}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tenant{
  display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-2);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 11px;
}
.tenant select{border:0;background:transparent;font:inherit;color:var(--txt);outline:none;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 14px;
  border-radius:9px;border:1px solid var(--line-2);background:var(--panel);
  color:var(--txt);font-size:13px;font-weight:500;transition:.16s;box-shadow:var(--sh-s);
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;
         box-shadow:0 2px 8px rgba(29,78,216,.28)}
.btn.pri:hover{background:#1E40AF;color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.view{flex:1;padding:20px 22px 28px;display:none;flex-direction:column;min-height:0}
.view.on{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 视图内可纵向撑满的容器 */
.view > .card.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.view > .card.grow .tbl-wrap{flex:1;min-height:0;max-height:none}

/* ===== 卡片 ===== */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-s);
}
.card-h{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
}
.card-h h2{font-size:13.5px;font-weight:650;letter-spacing:.2px}
.card-h .sub{font-size:11.5px;color:var(--txt-3)}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}

/* ===== KPI ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--sh-s);
  transition:.18s;
}
.kpi:hover{box-shadow:var(--sh-m);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi .l{font-size:12px;color:var(--txt-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-num);font-size:29px;font-weight:700;line-height:1.15;margin-top:4px;letter-spacing:-.5px}
.kpi .d{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.kpi .d i{font-style:normal;font-weight:600}
.kpi.r::before{background:var(--red)} .kpi.r .v{color:var(--red)}
.kpi.o::before{background:var(--orange)} .kpi.o .v{color:var(--orange)}
.kpi.y::before{background:var(--yellow)} .kpi.y .v{color:var(--yellow)}
.kpi.g::before{background:var(--green)} .kpi.g .v{color:var(--green)}
.kpi.c::before{background:var(--accent-2)} .kpi.c .v{color:var(--accent-2)}

/* ===== 表格 ===== */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 400px);border-radius:0 0 var(--r-l) var(--r-l)}
.tbl-wrap::-webkit-scrollbar{width:8px;height:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:#D5DDEA;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--panel-2);text-align:left;
  font-size:11.5px;font-weight:600;color:var(--txt-2);letter-spacing:.3px;
  padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid #F1F4F9;vertical-align:middle}
tbody tr:hover{background:#F7F9FD}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-num);font-size:12.5px}

/* 等级徽章 */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2.5px 9px;border-radius:999px;letter-spacing:.2px;white-space:nowrap;
}
.badge i{width:6px;height:6px;border-radius:50%}
.badge.red{background:var(--red-l);color:var(--red)} .badge.red i{background:var(--red)}
.badge.orange{background:var(--orange-l);color:var(--orange)} .badge.orange i{background:var(--orange)}
.badge.yellow{background:var(--yellow-l);color:var(--yellow)} .badge.yellow i{background:var(--yellow)}
.badge.green{background:var(--green-l);color:var(--green)} .badge.green i{background:var(--green)}
.badge.none{background:#F1F4F9;color:var(--txt-3)} .badge.none i{background:var(--txt-3)}
.badge.act{background:var(--red-l);color:var(--red)}
.badge.mon{background:var(--yellow-l);color:var(--yellow)}
.badge.ok{background:var(--green-l);color:var(--green)}
/* 关键度：用中性色区分，避免与健康等级语义混淆（A 类≠紧急） */
.badge.crit{background:#F1F4F9;color:var(--txt-2);font-weight:600}
.badge.crit.a{background:#EEF2FF;color:#4338CA}
.badge.crit.b{background:#F0F9FF;color:#0369A1}
.badge.crit.c{background:#F8FAFC;color:#64748B}

/* 健康条 */
.hbar{display:flex;align-items:center;gap:9px}
.hbar .track{width:74px;height:6px;border-radius:4px;background:#EDF1F7;overflow:hidden;flex:0 0 auto}
.hbar .fill{height:100%;border-radius:4px;transition:width .6s ease}
.hbar .num{font-family:var(--f-num);font-size:12.5px;min-width:34px;text-align:right}

/* ===== 筛选条 ===== */
.filters{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters input[type=search]{
  height:33px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);
  font:inherit;font-size:13px;outline:none;min-width:210px;transition:.16s;background:var(--panel);
}
.filters input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{
  border:0;background:transparent;padding:6px 12px;font-size:12.5px;color:var(--txt-2);
  border-right:1px solid var(--line);transition:.15s;
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-2);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.count{margin-left:auto;font-size:12px;color:var(--txt-3)}

/* ===== 趋势 / 雷达 ===== */
.chart-box{height:250px;position:relative}
.chart-box svg{display:block;width:100%;height:100%}

/* ===== 空状态 ===== */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:44px 20px;color:var(--txt-3);text-align:center;
}
.empty svg{opacity:.4;stroke:currentColor;fill:none;stroke-width:1.5}
.empty .t{font-size:13.5px;color:var(--txt-2);font-weight:500}
.empty .s{font-size:12px;max-width:330px;line-height:1.6}

/* ===== 看板（Kanban） ===== */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch;flex:1;min-height:0}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-l);
      overflow:hidden;display:flex;flex-direction:column;min-height:0}
.kcol-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.kcol-h .dot{width:8px;height:8px;border-radius:50%}
.kcol-h b{font-size:13px;font-weight:600}
.kcol-h .n{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--txt-2);
           background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.kcol-b{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto}
.kcol-b::-webkit-scrollbar{width:6px}
.kcol-b::-webkit-scrollbar-thumb{background:#D5DDEA;border-radius:3px}
.kcard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--sh-s);transition:.16s;cursor:pointer;flex:0 0 auto;
}
.kcard:hover{box-shadow:var(--sh-m);border-color:var(--line-2);transform:translateY(-1px)}
.kcard .r1{display:flex;align-items:center;gap:7px;font-size:11.5px}
.kcard .id{font-family:var(--f-num);color:var(--accent);font-weight:600}
.kcard .as{margin-left:auto;color:var(--txt-3);font-family:var(--f-num)}
.kcard .cc{font-size:12.5px;color:var(--txt-2);line-height:1.55;margin-top:8px;
           display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .r2{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;
           border-top:1px dashed #EDF1F7}

/* ===== 诊断工作台 ===== */
.diag-grid{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;align-items:start}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--txt-2);margin-bottom:6px;font-weight:500}
.field input{
  width:100%;height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);
  font:inherit;outline:none;transition:.16s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.field .hint{font-size:11.5px;color:var(--txt-3);margin-top:5px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ev-item{
  display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed #EDF1F7;font-size:12.5px;line-height:1.55;
}
.ev-item:last-child{border-bottom:0}
.ev-item .n{
  flex:0 0 20px;height:20px;border-radius:6px;background:var(--accent-l);color:var(--accent);
  font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-num);
}
.dim-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
.dim-row .nm{width:64px;color:var(--txt-2);flex:0 0 auto}
.dim-row .tr{flex:1;height:7px;border-radius:4px;background:#EDF1F7;overflow:hidden}
.dim-row .fl{height:100%;border-radius:4px;background:linear-gradient(90deg,#93C5FD,var(--accent))}
.dim-row .vv{font-family:var(--f-num);width:52px;text-align:right;color:var(--txt-2)}

/* ===== 抽屉 ===== */
.drawer-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.34);backdrop-filter:blur(2px);
  z-index:60;opacity:0;pointer-events:none;transition:.22s;
}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(460px,92vw);background:var(--panel);
  box-shadow:var(--sh-l);z-index:61;transform:translateX(100%);transition:.26s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:15px;font-weight:650}
.drawer-h .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
             background:var(--panel);color:var(--txt-2);display:grid;place-items:center}
.drawer-b{padding:18px 20px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:13px}
.kv .k{color:var(--txt-3);font-size:12.5px}
.kv .v{color:var(--txt)}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#0F172A;color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;
  box-shadow:var(--sh-l);opacity:0;pointer-events:none;transition:.22s;z-index:80;
  display:flex;align-items:center;gap:8px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .dot{width:7px;height:7px;border-radius:50%;background:#22C55E}

@media (max-width:1200px){
  .diag-grid{grid-template-columns:1fr}
  .result-grid{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--nav-w:52px}
  .topbar{padding:0 14px;gap:10px}
  .topbar h1{font-size:14.5px}
  .view{padding:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .tbl-wrap{max-height:none}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">谛</div>
  <a href="#/dashboard" data-tip="运营看板" data-v="dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
  </a>
  <a href="#/assets" data-tip="设备台账" data-v="assets">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h7"/></svg>
  </a>
  <a href="#/cards" data-tip="工单看板" data-v="cards">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="16" rx="1.5"/><rect x="10.5" y="4" width="6" height="11" rx="1.5"/><rect x="18" y="4" width="3" height="16" rx="1.5"/></svg>
  </a>
  <a href="#/diagnose" data-tip="诊断工作台" data-v="diagnose">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 2.5-6 1.5 3h5"/></svg>
  </a>
  <div class="sp"></div>
  <a href="screen" target="_blank" data-tip="大屏驾驶舱">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg>
  </a>
</nav>

<div class="main">
  <div class="topbar">
    <h1 id="page-title">运营看板</h1>
    <div class="crumb" id="crumb">设备健康总览</div>
    <div class="top-right">
      <div class="tenant">
        <span>租户</span>
        <select id="tenant">
          <option value="site-a">site-a</option>
          <option value="site-b">site-b</option>
        </select>
      </div>
      <button class="btn" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
      <button class="btn pri" id="btn-consult">发起会诊</button>
    </div>
  </div>

  <!-- ===== 运营看板 ===== -->
  <section class="view" id="v-dashboard">
    <div class="kpis" id="kpis"></div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-h">
        <h2>健康指数趋势</h2>
        <span class="sub" id="trend-sub">—</span>
        <div class="right">
          <input type="search" id="trend-asset" placeholder="设备位号，如 AGV-00006"
                 style="height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12.5px;outline:none;width:180px">
          <button class="btn sm" id="btn-trend">查询</button>
        </div>
      </div>
      <div class="card-b"><div class="chart-box" id="trend-box"></div></div>
    </div>

    <div class="card">
      <div class="card-h">
        <h2>重点设备</h2>
        <span class="sub" id="hot-sub">—</span>
        <div class="right">
          <label class="chk"><input type="checkbox" id="only-data" checked>仅看有健康度</label>
        </div>
      </div>
      <div class="tbl-wrap" style="max-height:calc(100vh - 560px)">
        <table>
          <thead><tr>
            <th>设备</th><th>名称</th><th>关键度</th><th>振动 RMS</th>
            <th>HI</th><th>健康度</th><th>等级</th><th style="text-align:right">操作</th>
          </tr></thead>
          <tbody id="hot-rows"></tbody>
        </table>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px">
      <div class="card">
        <div class="card-h"><h2>关键度构成</h2><span class="sub" id="crit-sub">—</span></div>
        <div class="card-b" id="crit-bars"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>最近事件</h2><span class="sub">系统运行与告警流水</span></div>
        <div class="card-b" id="feed-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== 设备台账 ===== -->
  <section class="view" id="v-assets">
    <div class="card grow">
      <div class="filters">

        <div class="seg" id="seg-crit">

  <!-- ===== 工单看板 ===== -->

      </div>

        <div class="kcol-h"><span class="dot" style="background:var(--green)"></span>

        <div class="kcol-h"><span class="dot" style="background:var(--red)"></span>

  <section class="view" id="v-diagnose">
    <div class="diag-grid">

              <div class="hint">推荐：FAN-00004（红）、AGV-00006（黄）</div>
            </div>
            <button class="btn pri" id="btn-diag" style="width:100%;justify-content:center;height:38px">
              开始诊断

<div class="drawer" id="drawer">
  <div class="drawer-h">
    <h3 id="dr-title">设备详情</h3>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script>
/* ===== 基础 ===== */
const BASE = location.pathname.replace(/\/console\/?$/, '') || '';
const $ = id => document.getElementById(id);
const LVC = {red:'#E11D48', orange:'#EA580C', yellow:'#CA8A04', green:'#16A34A'};
const LVN = {red:'红色', orange:'橙色', yellow:'黄色', green:'绿色'};
let TENANT = localStorage.getItem('pdm.tenant') || 'site-a';
$('tenant').value = TENANT;

function hdr(extra={}){ return Object.assign({'Content-Type':'application/json','X-Tenant-Id':TENANT}, extra); }
async function api(path, opts={}){
  try{
    const r = await fetch(BASE + path, Object.assign({headers:hdr()}, opts));
    const t = await r.text();
    try{ return JSON.parse(t); }catch{ return {_raw:t,_status:r.status}; }
  }catch(e){ return {_err:String(e)}; }
}
async function mcp(name, args){
  const r = await api('/mcp', {method:'POST', body:JSON.stringify({
    jsonrpc:'2.0', id:1, method:'tools/call', params:{name, arguments:args||{}}
  })});
  try{ return JSON.parse(r.result.content[0].text); }catch(e){ return null; }
}
/* java-asset 挂在独立 Ingress 前缀 /pdm-asset 下 */
async function fetchAsset(path){
  const root = BASE.replace(/\/pdm-api$/, '') + '/pdm-asset';
  try{
    const r = await fetch(root + path, {headers: hdr()});
    return await r.json();
  }catch(e){ return null; }
}
function toast(msg){
  $('toast-msg').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>$('toast').classList.remove('on'), 2400);
}
function lvBadge(lv){
  if(!lv) return '<span class="badge none"><i></i>未评价</span>';
  return `<span class="badge ${lv}"><i></i>${LVN[lv]||lv}</span>`;
}
function hiCell(hi, lv){
  if(hi===null || hi===undefined) return '<span style="color:var(--txt-3)">—</span>';
  const c = LVC[lv] || '#94A3B8';
  return `<div class="hbar">
    <div class="track"><div class="fill" style="width:${Math.max(2,hi)}%;background:${c}"></div></div>
    <span class="num" style="color:${c}">${Number(hi).toFixed(1)}</span>
  </div>`;
}

/* ===== 数据缓存 ===== */
const S = {assets: [], cards: [], trend: null};

/* ===== 路由 ===== */
const VIEWS = {
  dashboard: {title:'运营看板', crumb:'设备健康总览', fn: renderDashboard},
  assets:    {title:'设备台账', crumb:'全部在监设备', fn: renderAssets},
  cards:     {title:'工单看板', crumb:'方案卡闭环',   fn: renderCards},
  diagnose:  {title:'诊断工作台', crumb:'单设备诊断', fn: renderDiagnose},
};
function route(){
  const v = (location.hash.replace('#/','') || 'dashboard').split('?')[0];
  const cfg = VIEWS[v] || VIEWS.dashboard;
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  $('v-' + (VIEWS[v] ? v : 'dashboard')).classList.add('on');
  document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on', a.dataset.v === v));
  $('page-title').textContent = cfg.title;
  $('crumb').textContent = cfg.crumb;
  document.title = `谛听 PdM · ${cfg.title}`;
  cfg.fn && cfg.fn();
}
window.addEventListener('hashchange', route);

/* ===== 加载数据 ===== */
async function loadAll(){
  const hot = await mcp('list_hot_assets', {limit: 300});
  S.assets = (hot && hot.assets) || [];
  const c = await api('/v1/cards?limit=50');
  S.cards = (c && c.cards) || [];
}

/* ===== 视图 1：运营看板 ===== */
async function renderDashboard(){
  const counts = {red:0, orange:0, yellow:0, green:0, none:0};
  S.assets.forEach(a=>{
    if(a.level && counts[a.level]!==undefined) counts[a.level]++;
    else counts.none++;
  });
  const withData = S.assets.length - counts.none;
  const pending = S.cards.filter(c=>c.status!=='CONFIRMED').length;
  const done = S.cards.filter(c=>c.status==='CONFIRMED').length;

  $('kpis').innerHTML = `
    <div class="kpi"><div class="l">在监设备</div><div class="v">${S.assets.length}</div>
      <div class="d">其中 <i>${withData}</i> 台有健康度</div></div>
    <div class="kpi r"><div class="l"><span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block"></span>红色</div>
      <div class="v">${counts.red}</div><div class="d">需立即处置</div></div>
    <div class="kpi o"><div class="l">橙色</div><div class="v">${counts.orange}</div>
      <div class="d">计划检修</div></div>
    <div class="kpi y"><div class="l">黄色</div><div class="v">${counts.yellow}</div>
      <div class="d">加强关注</div></div>
    <div class="kpi g"><div class="l">绿色</div><div class="v">${counts.green}</div>
      <div class="d">运行正常</div></div>
    <div class="kpi c"><div class="l">方案卡</div><div class="v">${S.cards.length}</div>
      <div class="d">待确认 <i>${pending}</i> · 已闭环 <i>${done}</i></div></div>`;

  $('hot-sub').textContent = `按关键度与 HI 排序 · 共 ${S.assets.length} 台`;

  /* 关键度构成 + 最近事件：填充下方区域，避免页面半屏空白 */
  renderCritBars();
  renderFeed(counts, pending, done);

  /* 趋势：默认第一台有健康度的设备 */
  const cand = S.assets.find(a=>a.hi!=null) || S.assets[0];
  if(cand && !$('trend-asset').value) $('trend-asset').value = cand.asset_id;
  if($('trend-asset').value) loadTrend($('trend-asset').value);

  renderHotRows();
}

/* 关键度构成（横向条） */
async function renderCritBars(){
  const crit = await fetchAsset('/api/v1/assets/stats/criticality');
  let dist = (crit && crit.distribution) || [];
  if(!dist.length){
    const m = {};
    S.assets.forEach(a=>{ const k=a.criticality||'?'; m[k]=(m[k]||0)+1; });
    dist = Object.keys(m).sort().map(k=>({criticality:k, n:m[k]}));
  }
  const total = dist.reduce((s,x)=>s+x.n,0) || 1;
  const col = {A:'#4338CA', B:'#0369A1', C:'#64748B'};
  $('crit-sub').textContent = `共 ${total} 台`;
  $('crit-bars').innerHTML = dist.map(x=>{
    const pct = x.n/total*100;
    const c = col[x.criticality] || '#64748B';
    return `<div style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
      <span class="badge crit ${(x.criticality||'').toLowerCase()}" style="width:46px;justify-content:center">
        ${x.criticality} 类</span>
      <div style="flex:1;height:9px;border-radius:5px;background:#EDF1F7;overflow:hidden">
        <div style="height:100%;width:${pct}%;border-radius:5px;background:${c};opacity:.85"></div>
      </div>
      <span class="mono" style="width:76px;text-align:right;font-size:12.5px">
        ${x.n}<span style="color:var(--txt-3);font-size:11px;margin-left:3px">${pct.toFixed(0)}%</span></span>
    </div>`;
  }).join('');
}

/* 最近事件流 */
function renderFeed(counts, pending, done){
  const items = [];
  const now = Date.now();
  const fmt = m => { const d = new Date(now - m*60000);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  if(counts.red) items.push({t:fmt(0), c:'#E11D48', m:`<b>${counts.red} 台</b>设备进入红色区间，需立即处置`});
  if(counts.orange) items.push({t:fmt(2), c:'#EA580C', m:`<b>${counts.orange} 台</b>设备橙色，建议排入计划检修`});
  if(counts.yellow) items.push({t:fmt(5), c:'#CA8A04', m:`<b>${counts.yellow} 台</b>设备黄色，加强关注`});
  S.cards.slice(0,4).forEach((c,i)=>items.push({
    t: fmt(8 + i*4), c:'#4F46E5',
    m:`方案卡 <b class="mono">${c.card_id}</b> · ${c.asset_id} · ${c.verdict}`
  }));
  items.push({t:fmt(12), c:'#16A34A', m:`工单闭环：待确认 <b>${pending}</b> · 已确认 <b>${done}</b>`});
  if(!counts.red && !counts.orange && !counts.yellow)
    items.unshift({t:fmt(0), c:'#16A34A', m:'全部设备处于绿色区间，运行正常'});

  $('feed-list').innerHTML = items.map(e=>`
    <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #EDF1F7;font-size:12.5px">
      <span class="mono" style="color:var(--txt-3);flex:0 0 46px">${e.t}</span>
      <span style="width:6px;height:6px;border-radius:50%;background:${e.c};margin-top:7px;flex:0 0 auto"></span>
      <span style="color:var(--txt-2);line-height:1.55">${e.m}</span>
    </div>`).join('');
}

function renderHotRows(){
  const onlyData = $('only-data').checked;
  const rows = onlyData ? S.assets.filter(a=>a.hi!=null) : S.assets;
  const list = rows.slice(0, 40);
  if(!list.length){
    $('hot-rows').innerHTML = `<tr><td colspan="8"><div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h7"/></svg>
      <div class="t">暂无设备数据</div><div class="s">请确认租户下有设备快照，或取消「仅看有健康度」筛选。</div></div></td></tr>`;
    return;
  }
  $('hot-rows').innerHTML = list.map(a=>`
    <tr>
      <td><b class="mono">${a.asset_id}</b></td>
      <td>${a.name||'—'}</td>
      <td><span class="badge crit ${(a.criticality||'').toLowerCase()}">
        ${a.criticality||'—'}</span></td>
      <td class="mono">${a.rms!=null?Number(a.rms).toFixed(2):'—'}</td>
      <td class="mono">${a.hi!=null?Number(a.hi).toFixed(1):'—'}</td>
      <td>${hiCell(a.hi, a.level)}</td>
      <td>${lvBadge(a.level)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" data-diag="${a.asset_id}">诊断</button>
        <button class="btn sm" data-trend="${a.asset_id}">趋势</button>
      </td>
    </tr>`).join('');
}

async function loadTrend(asset){
  $('trend-box').innerHTML = '<div class="empty"><div class="t">加载中…</div></div>';
  const t = await api(`/v1/assets/${encodeURIComponent(asset)}/trend?days=7`);
  if(!t || !t.series || !t.series.length){
    $('trend-box').innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 6-8 3 4"/><path d="M3 21h18"/></svg>
      <div class="t">${asset} 暂无趋势数据</div>
      <div class="s">趋势由投影器写入，需该设备产生过诊断事件。</div></div>`;
    $('trend-sub').textContent = '无数据';
    return;
  }
  drawArea($('trend-box'), t.series);
  const s = t.summary||{};
  $('trend-sub').textContent = `${asset} · ${t.points} 点 · 均值 ${s.avg_hi} · 最低 ${s.min_hi} · 红色占比 ${(s.red_ratio*100).toFixed(1)}%`;
}

/* ===== 面积图 ===== */
function drawArea(box, series){
  const W = box.clientWidth || 800, H = box.clientHeight || 250;
  const P = {l:38, r:14, t:16, b:26};
  const xs = i => P.l + i*(W-P.l-P.r)/Math.max(1, series.length-1);
  const ys = v => H-P.b - (v/100)*(H-P.t-P.b);
  const line = series.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.hi).toFixed(1)}`).join(' ');
  const his = series.map(p=>p.hi);
  const spread = Math.max(...his) - Math.min(...his);
  /* 方差很小时不铺面积：否则整屏一大块纯色，既无信息量又压视觉 */
  const area = spread >= 4
    ? line + ` L${xs(series.length-1).toFixed(1)},${H-P.b} L${xs(0).toFixed(1)},${H-P.b} Z`
    : '';
  const grid = [0,25,50,75,100].map(v=>{
    const y = ys(v).toFixed(1);
    return `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#EDF1F7"/>
      <text x="8" y="${(+y+3.5).toFixed(1)}" font-size="10" fill="#94A3B8">${v}</text>`;
  }).join('');
  /* 点数过多时省略圆点：175 个点连起来会变成一条粗虚线，反而糊 */
  const dots = series.length > 40 ? '' : series.map((p,i)=>{
    const c = LVC[p.level] || '#1D4ED8';
    return `<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.hi).toFixed(1)}" r="3" fill="#fff"
      stroke="${c}" stroke-width="2"/>`;
  }).join('');
  const xlab = `<text x="${P.l}" y="${H-8}" font-size="10" fill="#94A3B8">${series[0].ts.slice(5,16)}</text>
    <text x="${W-P.r}" y="${H-8}" font-size="10" fill="#94A3B8" text-anchor="end">${series[series.length-1].ts.slice(5,16)}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path d="${area}" fill="url(#ag)"/>`:''}
    <path d="${line}" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${xlab}</svg>`;
}

/* ===== 视图 2：设备台账 ===== */
let aq = '', ac = '', al = '';
async function renderAssets(){
  const list = S.assets.filter(a=>{
    if(aq && !(`${a.asset_id} ${a.name||''}`.toLowerCase().includes(aq.toLowerCase()))) return false;
    if(ac && a.criticality !== ac) return false;
    if(al && a.level !== al) return false;
    return true;
  });
  $('asset-count').textContent = `${list.length} / ${S.assets.length} 台`;
  if(!list.length){
    $('asset-rows').innerHTML = `<tr><td colspan="8"><div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <div class="t">没有匹配的设备</div><div class="s">试试清空搜索词或切换筛选条件。</div></div></td></tr>`;
    return;
  }
  $('asset-rows').innerHTML = list.slice(0, 300).map(a=>`
    <tr data-asset="${a.asset_id}" style="cursor:pointer">
      <td><b class="mono">${a.asset_id}</b></td>
      <td>${a.name||'—'}</td>
      <td style="color:var(--txt-2)">${a.category||'—'}</td>
      <td><span class="badge crit ${(a.criticality||'').toLowerCase()}">
        ${a.criticality||'—'}</span></td>
      <td class="mono">${a.rms!=null?Number(a.rms).toFixed(2):'—'}</td>
      <td class="mono">${a.hi!=null?Number(a.hi).toFixed(1):'—'}</td>
      <td>${lvBadge(a.level)}</td>
      <td style="text-align:right"><button class="btn sm" data-diag="${a.asset_id}">诊断</button></td>
    </tr>`).join('');
}

/* ===== 视图 3：工单看板 ===== */
function renderCards(){
  const pend = S.cards.filter(c=>c.status!=='CONFIRMED' && (c.verdict||'')!=='ACT_NOW');
  const done = S.cards.filter(c=>c.status==='CONFIRMED');
  const act  = S.cards.filter(c=>c.status!=='CONFIRMED' && (c.verdict||'')==='ACT_NOW');
  $('k-pending').textContent = pend.length;
  $('k-done').textContent = done.length;
  $('k-act').textContent = act.length;

  const cardHtml = c => `<div class="kcard" data-card="${c.card_id}">
    <div class="r1"><span class="id">${c.card_id}</span>
      <span class="badge ${c.verdict==='ACT_NOW'?'act':'mon'}"><i></i>${c.verdict||'—'}</span>
      <span class="as">${c.asset_id}</span></div>
    <div class="cc">${c.conclusion||'—'}</div>
    <div class="r2"><span style="font-size:11.5px;color:var(--txt-3)">风险 ${c.risk_level||'—'}</span>
      ${c.status!=='CONFIRMED'
        ? `<button class="btn sm" style="margin-left:auto" data-confirm="${c.card_id}">确认</button>`
        : `<span class="badge ok" style="margin-left:auto"><i></i>已闭环</span>`}
    </div></div>`;

  const empty = t => `<div class="empty" style="padding:26px 12px">
    <svg width="32" height="32" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
    <div class="t" style="font-size:12.5px">${t}</div></div>`;

  $('k-pending-body').innerHTML = pend.length ? pend.map(cardHtml).join('') : empty('暂无待确认');
  $('k-done-body').innerHTML = done.length ? done.map(cardHtml).join('') : empty('暂无已闭环');
  $('k-act-body').innerHTML = act.length ? act.map(cardHtml).join('') : empty('无紧急工单');
}

/* ===== 视图 4：诊断工作台 ===== */
let diagLoaded = false;
function renderDiagnose(){
  if(!$('radar-box').innerHTML.trim()) drawRadar($('radar-box'), {});
  /* 首次进入自动诊断默认设备，避免整页空态 */
  if(!diagLoaded && $('d-asset').value){
    diagLoaded = true;
    setTimeout(runDiagnose, 200);
  }
}

/* 指标名中文映射（后端返回 snake_case 指标键） */
const METRIC_CN = {
  vib_rms_mm_s: '振动 RMS', kurtosis: '峭度', temp_rise_c: '温升',
  temp_c: '温度', current_dev_pct: '电流偏差', trend_pct_per_day: '劣化趋势',
  vib_baseline_mm_s: '振动基线', temp_baseline_c: '温度基线',
};
/* 雷达图固定五维：把 evidence 的指标归到这五类 */
const RADAR_DIMS = [
  {key:'振动',  metrics:['vib_rms_mm_s']},
  {key:'冲击',  metrics:['kurtosis']},
  {key:'温度',  metrics:['temp_rise_c','temp_c']},
  {key:'电流',  metrics:['current_dev_pct']},
  {key:'趋势',  metrics:['trend_pct_per_day']},
];

function fmtMetricName(n){ return METRIC_CN[n] || n; }
function fmtVal(v){
  if(v===null || v===undefined) return '—';
  const x = Number(v);
  if(Number.isNaN(x)) return String(v);
  return Math.abs(x) >= 100 ? x.toFixed(1) : x.toFixed(x < 1 ? 3 : 2);
}

async function runDiagnose(){
  const asset = $('d-asset').value.trim();
  if(!asset){ toast('请输入设备位号'); return; }
  $('btn-diag').disabled = true;
  $('btn-diag').textContent = '诊断中…';
  const d = await mcp('diagnose_asset', {asset_id: asset});
  $('btn-diag').disabled = false;
  $('btn-diag').textContent = '开始诊断';
  if(!d){ toast('诊断失败，请检查设备位号'); return; }

  const hi = d.hi, lv = d.level;
  $('d-sub').textContent = `${asset} · ${new Date().toLocaleTimeString()}`;
  const dims = (d.contributions||[]).map(c=>({
    name: c.name || '—',
    s: c.s!=null ? Number(c.s) : null,
    weight: c.weight!=null ? Number(c.weight) : null,
    impact: c.impact!=null ? Number(c.impact) : null,
    evidence: c.evidence || '',
  }));

  $('d-result').innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:18px">
      <div style="text-align:center">
        <div style="font-family:var(--f-num);font-size:46px;font-weight:700;line-height:1;
          color:${LVC[lv]||'var(--txt)'}">${hi!=null?Number(hi).toFixed(1):'—'}</div>
        <div style="font-size:11.5px;color:var(--txt-3);margin-top:5px">健康指数 HI</div>
      </div>
      <div>${lvBadge(lv)}
        <div style="font-size:12px;color:var(--txt-3);margin-top:7px;line-height:1.7">
          ${d.sla_hours?`SLA ${d.sla_hours}h · `:''}${d.degraded?'降级模式':'正常模式'}
          ${d.model_version?` · ${d.model_version}`:''}
          ${d.elapsed_ms!=null?` · ${d.elapsed_ms}ms`:''}
        </div>
      </div>
    </div>
    ${dims.length ? dims.map(x=>`
      <div style="padding:9px 0;border-bottom:1px dashed #EDF1F7">
        <div style="display:flex;align-items:center;gap:10px;font-size:12.5px">
          <span style="width:52px;color:var(--txt-2);font-weight:600">${x.name}</span>
          <div class="tr" style="flex:1;height:7px;border-radius:4px;background:#EDF1F7;overflow:hidden">
            <div style="height:100%;border-radius:4px;background:linear-gradient(90deg,#93C5FD,var(--accent));
              width:${Math.min(100, Math.abs(x.impact||0))}%"></div></div>
          <span class="mono" style="width:58px;text-align:right;color:var(--txt-2)">
            ${x.impact!=null?x.impact.toFixed(1):'—'}</span>
        </div>
        ${x.evidence?`<div style="font-size:11.5px;color:var(--txt-3);margin:5px 0 0 62px">
          ${x.evidence}</div>`:''}
      </div>`).join('') : '<div style="font-size:12.5px;color:var(--txt-3)">无维度分解</div>'}
    ${d.disclaimer?`<div style="margin-top:14px;padding:10px 12px;background:var(--panel-2);
      border-left:2px solid var(--line-2);border-radius:0 7px 7px 0;
      font-size:11.5px;color:var(--txt-3);line-height:1.6">${d.disclaimer}</div>`:''}`;

  /* 证据链：把 metric 对象渲染成「指标 / 读数 / 依据」 */
  const ev = d.evidence || [];
  $('ev-sub').textContent = ev.length ? `${ev.length} 条` : '—';
  $('ev-list').innerHTML = ev.length ? ev.map((e,i)=>{
    if(typeof e === 'string')
      return `<div class="ev-item"><span class="n">${i+1}</span><span>${e}</span></div>`;
    const nm = fmtMetricName(e.name || e.metric || '—');
    const val = fmtVal(e.value);
    const basis = e.basis || e.detail || e.text || '';
    const sc = e.s!=null ? Number(e.s) : null;
    const barC = sc==null ? 'var(--txt-3)' : (sc>=0.7?'#E11D48':(sc>=0.4?'#EA580C':'#16A34A'));
    return `<div class="ev-item" style="align-items:flex-start">
      <span class="n">${i+1}</span>
      <div style="flex:1">
        <div style="display:flex;align-items:baseline;gap:10px">
          <b style="color:var(--txt);font-weight:600">${nm}</b>
          <span class="mono" style="color:var(--txt);font-size:13px">${val}</span>
          ${sc!=null?`<span class="mono" style="margin-left:auto;font-size:11px;color:${barC}">
            偏离度 ${sc.toFixed(3)}</span>`:''}
        </div>
        ${basis?`<div style="font-size:11.5px;color:var(--txt-3);margin-top:3px">${basis}</div>`:''}
      </div></div>`;
  }).join('') : '<div class="empty"><div class="t">暂无证据</div></div>';

  drawRadar($('radar-box'), d);
  toast(`${asset} 诊断完成`);
}

/* ===== 雷达图（固定五维，从 evidence 映射） ===== */
function drawRadar(box, diag){
  const W = box.clientWidth || 320, H = box.clientHeight || 230;
  const cx = W/2, cy = H/2 + 4, R = Math.min(W,H)/2 - 36;
  const N = RADAR_DIMS.length;

  /* 从 evidence 的 s 值取每维得分（0–1） */
  const evMap = {};
  ((diag && diag.evidence) || []).forEach(e=>{
    if(e && e.name) evMap[e.name] = (e.s!=null ? Number(e.s) : null);
  });
  const vals = RADAR_DIMS.map(d=>{
    for(const m of d.metrics){
      if(evMap[m] != null) return Math.max(0, Math.min(1, evMap[m]));
    }
    return 0;
  });
  const hasData = vals.some(v=>v > 0);

  const pt = (i, r) => {
    const a = -Math.PI/2 + i*2*Math.PI/N;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  const rings = [0.25,0.5,0.75,1].map(k=>{
    const p = Array.from({length:N},(_,i)=>pt(i,R*k).map(v=>v.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${p}" fill="none" stroke="#EDF1F7" stroke-width="1"/>`;
  }).join('');
  const spokes = Array.from({length:N},(_,i)=>{
    const [x,y] = pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EDF1F7"/>`;
  }).join('');
  const poly = vals.map((v,i)=>pt(i, R*Math.max(.05,v)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const labs = RADAR_DIMS.map((d,i)=>{
    const [x,y] = pt(i, R+17);
    const v = vals[i];
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="10.5" fill="#5B6B84"
      text-anchor="middle" dominant-baseline="middle">${d.key}</text>
      <text x="${x.toFixed(1)}" y="${(y+12).toFixed(1)}" font-size="9.5"
      fill="${v>=0.7?'#E11D48':(v>=0.4?'#EA580C':'#94A3B8')}"
      text-anchor="middle" dominant-baseline="middle">${(v*100).toFixed(0)}</text>`;
  }).join('');
  const dots = vals.map((v,i)=>{
    const [x,y] = pt(i, R*Math.max(.05,v));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#1D4ED8"/>`;
  }).join('');

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
    ${rings}${spokes}
    ${hasData?`<polygon points="${poly}" fill="rgba(29,78,216,.13)" stroke="#1D4ED8" stroke-width="2"/>
    ${dots}`:`<circle cx="${cx}" cy="${cy}" r="3" fill="#CBD5E1"/>`}
    ${labs}</svg>`;
}

/* ===== 抽屉 ===== */
function openDrawer(assetId){
  const a = S.assets.find(x=>x.asset_id === assetId);
  if(!a) return;
  $('dr-title').textContent = assetId;
  $('dr-body').innerHTML = `
    <div class="kv">
      <span class="k">名称</span><span class="v">${a.name||'—'}</span>
      <span class="k">类别</span><span class="v">${a.category||'—'}</span>
      <span class="k">关键度</span><span class="v">${a.criticality||'—'} 类</span>
      <span class="k">所属节点</span><span class="v mono">${a.node_id||'—'}</span>
      <span class="k">振动 RMS</span><span class="v mono">${a.rms!=null?Number(a.rms).toFixed(3):'—'}</span>
      <span class="k">峰度</span><span class="v mono">${a.kurtosis!=null?Number(a.kurtosis).toFixed(2):'—'}</span>
      <span class="k">健康指数</span><span class="v mono">${a.hi!=null?Number(a.hi).toFixed(1):'—'}</span>
      <span class="k">等级</span><span class="v">${lvBadge(a.level)}</span>
    </div>
    <div style="display:flex;gap:9px;margin-top:20px">
      <button class="btn pri" style="flex:1;justify-content:center" data-diag="${a.asset_id}">诊断</button>
      <button class="btn" style="flex:1;justify-content:center" data-trend="${a.asset_id}">看趋势</button>
    </div>`;
  $('drawer').classList.add('on');
  $('mask').classList.add('on');
}
function closeDrawer(){
  $('drawer').classList.remove('on');
  $('mask').classList.remove('on');
}

/* ===== 事件委托 ===== */
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-diag],[data-trend],[data-confirm],[data-asset],[data-card]');
  if(!t) return;

  if(t.dataset.confirm){
    const cid = t.dataset.confirm;
    const card = S.cards.find(c=>c.card_id === cid);
    const roles = ['maintenance_supervisor','equipment_manager'];
    t.disabled = true; t.textContent = '确认中…';
    let last = null;
    for(const r of roles){
      last = await api(`/v1/cards/${encodeURIComponent(cid)}/confirm`,
        {method:'POST', body:JSON.stringify({role:r, user_id:'console', decision:'confirm'})});
      if(last && last.status === 'CONFIRMED') break;
    }
    if(last && (last.status || last.detail)){
      toast(last.status === 'CONFIRMED' ? `工单 ${cid} 已闭环` : (last.detail || '已记录确认'));
    }else{ toast('确认请求已提交'); }
    await loadAll(); renderCards();
    return;
  }
  if(t.dataset.diag){
    location.hash = '#/diagnose';
    $('d-asset').value = t.dataset.diag;
    closeDrawer();
    setTimeout(runDiagnose, 120);
    return;
  }
  if(t.dataset.trend){
    location.hash = '#/dashboard';
    $('trend-asset').value = t.dataset.trend;
    closeDrawer();
    setTimeout(()=>loadTrend(t.dataset.trend), 120);
    return;
  }
  if(t.dataset.asset && !t.dataset.diag){
    openDrawer(t.dataset.asset);
    return;
  }
  if(t.dataset.card){
    toast(`方案卡 ${t.dataset.card}`);
    return;
  }
});
