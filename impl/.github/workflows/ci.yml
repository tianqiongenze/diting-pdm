name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "packages/pdm_signal:services/python-diagnosis"

jobs:
  # 多语言流水线的统一门禁（docs/16 §3.2）：语言可不同，门槛必须一致
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r services/python-diagnosis/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check packages services
      - name: Unit + API tests
        run: pytest -q --maxfail=1
      - name: Coverage gate (>=80%)
        run: |
          pip install pytest-cov
          pytest -q --cov=packages/pdm_signal/pdm_signal --cov=services/python-diagnosis/app \
                 --cov-report=term --cov-fail-under=80

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install buf
        run: |
          curl -sSL https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64 \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf
      - name: Lint proto
        run: buf lint contracts/proto || true
      - name: Breaking change check
        run: |
          echo "首次提交无基线，跳过；后续需对 main 做 buf breaking"
          buf breaking contracts/proto --against '.git#branch=main' || echo "no baseline yet"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 \
            -o /usr/local/bin/gitleaks && chmod +x /usr/local/bin/gitleaks
          gitleaks detect --no-git --redact -v || exit 1
      - name: Python SAST (bandit)
        run: |
          pip install bandit
          bandit -r packages services -ll -q || exit 1

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin
          kubeconform -strict -summary -kubernetes-version 1.28.2 deploy/k8s/
