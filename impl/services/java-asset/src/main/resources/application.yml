server:
  port: 8081

spring:
  application:
    name: pdm-java-asset
  datasource:
    url: jdbc:mysql://${PDM_TIDB_HOST:tidb.infra.svc.cluster.local}:${PDM_TIDB_PORT:4000}/pdm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${PDM_TIDB_USER:pdm_diag}
    password: ${PDM_TIDB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.yadea.pdm: ${PDM_LOG_LEVEL:INFO}
